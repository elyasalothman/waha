name: Trigger Codemagic ios-release

on:
  workflow_dispatch:

jobs:
  trigger:
    name: Start Codemagic ios-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Codemagic build
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CODEMAGIC_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret CODEMAGIC_API_TOKEN (Codemagic → Account settings → API token)."
            exit 1
          fi
          if [ -z "${CODEMAGIC_APP_ID:-}" ]; then
            echo "::error::Missing GitHub secret CODEMAGIC_APP_ID (Codemagic app settings → Application ID)."
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE=$(
            curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
              --data "{\"appId\":\"$CODEMAGIC_APP_ID\",\"workflowId\":\"ios-release\",\"branch\":\"main\"}" \
              -X POST https://api.codemagic.io/builds
          )

          echo "Codemagic API HTTP $HTTP_CODE"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Codemagic API returned HTTP $HTTP_CODE"
            exit 1
          fi

          BUILD_ID=$(
            python3 - <<'PY' "$RESPONSE_FILE"
          import json, sys
          data = json.load(open(sys.argv[1]))
          build = data.get("build") or data
          print(build.get("_id") or build.get("id") or "")
          PY
          )

          if [ -n "$BUILD_ID" ]; then
            echo "Codemagic build id: $BUILD_ID"
            echo "Codemagic build URL: https://codemagic.io/app/$CODEMAGIC_APP_ID/build/$BUILD_ID"
          else
            echo "::warning::Build started but response did not include a build id."
          fi
