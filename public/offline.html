<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f0" />
    <meta name="robots" content="noindex" />
    <title>دون اتصال · واحة</title>
    <style>
      body {
        margin: 0;
        background: #f6f5f0;
        color: #233c32;
        font-family: system-ui, sans-serif;
        display: grid;
        min-height: 100dvh;
        place-items: center;
      }
      main {
        max-width: 30rem;
        padding: 32px;
        text-align: center;
      }
      p {
        line-height: 1.9;
        color: #56675e;
      }
      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid #315644;
        border-radius: 12px;
        font: inherit;
        background: #315644;
        color: white;
        text-decoration: none;
        margin: 6px;
      }
      a {
        background: transparent;
        color: #315644;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>واحتك قريبة، حتى دون اتصال</h1>
      <p>
        هذه الصفحة غير محفوظة على جهازك بعد. يمكنك العودة إلى الصفحات التي زرتها أو إعادة المحاولة
        عند عودة الإنترنت. تبقى كتبك المحلية على هذا الجهاز.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button><a href="/">الرئيسية</a>
    </main>
  </body>
</html>
