<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0d0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="واحة" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>واحة · Waha</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="./fallback.css" />
    <script src="./native-ios.js" defer></script>
  </head>
  <body>
    <main class="oasis">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M16 8.5v9.5M10.5 16.5c2.4 4.2 8.6 4.2 11 0"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <circle cx="16" cy="16" r="1.4" fill="currentColor" />
      </svg>
      <h1>واحة</h1>
      <p class="en">Waha</p>
      <p class="tag">واحتك الرقمية — صلاة، أوراق، مال، وأدوات يومك.</p>
      <p class="hint">أنت في واحة دون اتصال. هذه الأدوات محفوظة داخل التطبيق؛ محسن والأخبار وحصتي والكتب المتصلة تحتاج الإنترنت.</p>
      <section aria-labelledby="offline-day">
        <h2 id="offline-day">ورد يومي</h2>
        <label><input id="reading" type="checkbox" /> قرأت وردي</label>
        <label><input id="dhikr" type="checkbox" /> أذكار اليوم</label>
        <button id="count" type="button">تسبيح: 0</button>
        <button id="reset-count" type="button">تصفير التسبيح</button>
      </section>
      <section aria-labelledby="notes-title">
        <h2 id="notes-title">ملاحظاتي دون اتصال</h2>
        <label for="notes">ملاحظة محفوظة على الجهاز</label>
        <textarea id="notes" rows="5" maxlength="20000"></textarea>
        <p id="save-status" role="status"></p>
      </section>
      <a class="retry" href="https://waha.hajdah.com/today">إعادة الاتصال بواحة</a>
      <script src="./offline-tools.js" defer></script>
    </main>
  </body>
</html>
